name: Hatena Blog Sync

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup blogsync
        run: |
          go install github.com/x-motemen/blogsync@latest
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Create Config
        env:
          BLOG_ID: ${{ secrets.HATENA_BLOG_ID }}
          USER_ID: ${{ secrets.HATENA_USER_ID }}
          API_KEY: ${{ secrets.HATENA_API_KEY }}
        run: |
          # BLOG_IDのサニタイズ (URLスキーム除去、末尾スラッシュ除去、空白除去)
          CLEAN_BLOG_ID=$(echo "${BLOG_ID}" | sed -e 's|^https://||' -e 's|^http://||' -e 's|/$||' | tr -d '[:space:]')

          if [ -z "$CLEAN_BLOG_ID" ]; then
            echo "Error: HATENA_BLOG_ID is not set or invalid."
            exit 1
          fi

          # 設定ファイルを生成 (絶対パスを使用)
          # 注意: GitHub Actions上では絶対パスの方が安全な場合がある
          ABS_ROOT="$(pwd)/articles"
          
          cat <<CONFIG > blogsync.yaml
          $CLEAN_BLOG_ID:
            username: $USER_ID
            password: $API_KEY
            default:
              local_root: $ABS_ROOT
          CONFIG
          
          echo "Generated Config for: $CLEAN_BLOG_ID"
          echo "Local root set to: $ABS_ROOT"
          
          echo "--- blogsync.yaml content (masked) ---"
          sed 's/password: .*/password: ***/g' blogsync.yaml | sed 's/username: .*/username: ***/g'
          echo "--------------------------------------"

      - name: Sync and Commit Back
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 変更されたMarkdownファイルを取得
          FILES=$(git diff --name-only HEAD^ HEAD | grep '^articles/.*\.md$' || true)
          if [ -z "$FILES" ]; then
            echo "No markdown files changed."
            exit 0
          fi
          
          echo "Changed files: $FILES"
          
          # 絶対パスのルートを取得
          ABS_ROOT="$(pwd)"

          for FILE in $FILES; do
             # ファイルが存在しない場合はスキップ (削除された場合など)
             if [ ! -f "$FILE" ]; then
               continue
             fi
             
             # 絶対パスに変換
             ABS_FILE="$ABS_ROOT/$FILE"

             # EditURLがない(=新規記事)の場合、Draft: true を強制する
             if ! grep -q "EditURL:" "$ABS_FILE"; then
               echo "New article detected: $FILE"
               if grep -q "Draft: false" "$ABS_FILE"; then
                 echo "  Enforcing Draft: true for safety."
                 sed -i 's/Draft: false/Draft: true/' "$ABS_FILE"
               elif ! grep -q "Draft:" "$ABS_FILE"; then
                 echo "  Adding Draft: true."
                 # 最初の --- の後に挿入
                 sed -i '0,/^---$/s//---\nDraft: true/' "$ABS_FILE"
               fi
             else
               echo "Existing article update: $FILE"
             fi
             
             # 個別にPush (絶対パスを使用)
             echo "Pushing $ABS_FILE..."
             blogsync push "$ABS_FILE"
          done

          # 変更をコミットバック
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          if git diff --quiet; then
            echo "No changes to commit back."
          else
            git add articles/*.md
            git commit -m "chore: update blog metadata [skip ci]"
            git push origin HEAD:${{ github.ref }}
          fi

      - name: Comment Preview URL
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const blogId = '${{ secrets.HATENA_BLOG_ID }}';
            const body = `### 📝 ブログ同期完了\n\n確認はこちら: https://${blogId}/`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
