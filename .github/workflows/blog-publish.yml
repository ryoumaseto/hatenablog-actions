name: Hatena Blog Sync

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup blogsync
        run: |
          go install github.com/x-motemen/blogsync@latest
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Create Config
        env:
          BLOG_ID: ${{ secrets.HATENA_BLOG_ID }}
          USER_ID: ${{ secrets.HATENA_USER_ID }}
          API_KEY: ${{ secrets.HATENA_API_KEY }}
        run: |
          # BLOG_IDのサニタイズ (URLスキーム除去、末尾スラッシュ除去、空白除去)
          CLEAN_BLOG_ID=$(echo "${BLOG_ID}" | sed -e 's|^https://||' -e 's|^http://||' -e 's|/$||' | tr -d '[:space:]')

          if [ -z "$CLEAN_BLOG_ID" ]; then
            echo "Error: HATENA_BLOG_ID is not set or invalid."
            exit 1
          fi

          # 設定ファイルを生成 (local_rootをカレントディレクトリ . に設定してマッチングを確実にする)
          cat <<CONFIG > blogsync.yaml
          $CLEAN_BLOG_ID:
            username: $USER_ID
            password: $API_KEY
            default:
              local_root: .
          CONFIG
          
          echo "Generated Config for: $CLEAN_BLOG_ID (local_root: .)"
          
          # デバッグ用
          echo "--- blogsync.yaml content (masked) ---"
          sed 's/password: .*/password: ***/g' blogsync.yaml | sed 's/username: .*/username: ***/g'
          echo "--------------------------------------"

      - name: Sync and Commit Back
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 変更されたMarkdownファイルを取得 (相対パス)
          FILES=$(git diff --name-only HEAD^ HEAD | grep '^articles/.*\.md$' || true)
          if [ -z "$FILES" ]; then
            echo "No markdown files changed."
            exit 0
          fi
          
          echo "Changed files: $FILES"

          for FILE in $FILES; do
             # ファイルが存在しない場合はスキップ
             if [ ! -f "$FILE" ]; then
               continue
             fi

             # 1. 新規記事 (EditURLがない) -> Draft: yes (true) を強制
             # 2. 既存記事 (EditURLがある) -> そのまま更新
             
             if ! grep -q "EditURL:" "$FILE"; then
               echo "[NEW] Processing new article: $FILE"
               
               # Draftステータスのチェックと強制書き換え
               if grep -q "Draft: false" "$FILE"; then
                 echo "  -> Forcing Draft: true"
                 sed -i 's/Draft: false/Draft: true/' "$FILE"
               elif ! grep -qE "Draft: (true|yes)" "$FILE"; then
                 echo "  -> Adding Draft: true"
                 # フロントマターの最後に挿入（簡易的）
                 sed -i '/^---$/a Draft: true' "$FILE" 
                 # 注意: 2個目の---の後に付く可能性もあるが、通常は最初の---の後、あるいは各行チェックが必要
                 # より安全に: 最初の行が --- であれば、その直後(2行目)に挿入など
               fi
             else
               echo "[UPDATE] Updating existing article: $FILE"
             fi
             
             # Push実行 (相対パス)
             echo "Exec: blogsync push $FILE"
             blogsync push "$FILE"
          done

          # 変更をコミットバック (Draftなどの自動修正分、およびblogsyncが追記するEditURL)
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          if git diff --quiet; then
            echo "No changes to commit back."
          else
            git add articles/*.md
            git commit -m "chore: update blog metadata [skip ci]"
            git push origin HEAD:${{ github.ref }}
          fi

      - name: Comment Preview URL
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const blogId = '${{ secrets.HATENA_BLOG_ID }}';
            const body = `### 📝 ブログ同期完了\n\n確認はこちら: https://${blogId}/`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
